// Relay keepalive and teardown. The proxy in front of the relay (Cloudflare) closes a WebSocket that sends no
// data for about 100 s, and the game sends nothing while a map loads or a menu sits open. Once the page has said
// hello to the relay (an H frame), send a no-op search (Q with qid 0xffffffff) every 30 s: the relay counts it as
// activity and answers nothing, so no game code sees it. The hello is the test, not the URL: the public relay is
// wss://aetheris.win/eos-relay and the dev server's is /relay.
(function () {
  var nativeSend = WebSocket.prototype.send, started = new WeakSet(), sockets = [];
  function keepalive(ws) {
    var timer = setInterval(function () {
      if (ws.readyState !== 1) { if (ws.readyState > 1) clearInterval(timer); return; }
      var q = new Uint8Array(5);
      q[0] = 0x51; q[1] = q[2] = q[3] = q[4] = 0xff;
      try { nativeSend.call(ws, q); } catch (e) {}
    }, 30000);
  }
  // The runtime pauses the guest at a frame boundary while the tab is hidden (rt/web/library.js, ?bgrun turns that
  // off), so a host answered nothing and a joining page never left its loading screen whenever its window was not the
  // one in front - the relay still had both sockets, the packets just stopped. Turn ?bgrun on for a page that talks to
  // the relay (at load, and again when the hello arrives in case the URL had no relay of its own), so hosting and
  // joining work whatever window the player is looking at. Measured with the hidden page forced: without it the guest
  // presents 0 frames in 8 s hidden, with it 58 fps. The runtime reads the option at its first hidden frame.
  function bgRun() {
    try {
      var u = new URL(location.href);
      if (u.searchParams.has('bgrun')) return;
      u.searchParams.set('bgrun', '1');
      history.replaceState(history.state, '', u.href);
    } catch (e) {}
  }
  // also at load, before the guest starts: a tab hidden during the download would otherwise cache the old answer.
  // The relay is part of the build (PROD_RELAY), so this does not depend on anything in the address.
  try { bgRun(); } catch (e) {}
  WebSocket.prototype.send = function (data) {
    var result = nativeSend.call(this, data);
    try {
      if (!started.has(this) && data && data.byteLength >= 33) {
        var view = new Uint8Array(data.buffer || data, data.byteOffset || 0, 1);
        if (view[0] === 0x48) { started.add(this); sockets.push(this); keepalive(this); bgRun(); }
      }
    } catch (e) {}
    return result;
  };
  // A guest that exited (its process called TerminateProcess/ExitProcess, often after running out of memory) must not
  // keep its servers listed: the keepalive would hold the socket open forever and everyone who clicked one of them
  // would sit on a loading screen. Closing it makes the relay withdraw them.
  window.__rxcRelayClose = function (why) {
    for (var i = 0; i < sockets.length; i++) {
      try { if (sockets[i].readyState < 2) sockets[i].close(1000, String(why || 'guest exited').slice(0, 100)); } catch (e) {}
    }
    sockets = [];
  };
})();

// on this repo, one file at a time, and the next attempt usually succeeds. Without a retry one unlucky 1 MB chunk ends
// a file read and the game stalls, so retry once, then try the other jsDelivr mirrors and finally raw GitHub. Inlined
// rather than loaded as a file so a jsDelivr @main cache delay can never leave the page running without it.

  const GPU_LOST = 'The browser lost its WebGL context: a GPU reset, a driver recovery, or the GPU process running out of memory. The game cannot rebuild its graphics state.\n\nReload the page to continue. If it keeps happening, close other tabs and apps and start the game at 540p with a 50% 3D resolution.';
  canvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    showFatal('The graphics device was reset', GPU_LOST);
  });
  canvas.addEventListener('webglcontextrestored', () => showFatal('The graphics device was reset', 'Reload the page to continue.'));
  document.addEventListener('pointerlockchange', () => $('hint').classList.toggle('show', started && !locked()));

  // ---- audio: an AudioWorklet playing the PCM the game's audio device produces (rt/win32/wasapi.c). A small jitter
  // buffer: playback starts with 80 ms queued and increases that target after an underrun, so late delivery plays in longer pieces instead of
  // crackling; a gap decays to silence and the stream fades back in (no clicks); a backlog over 350 ms (the game ran
  // ahead of the device) skips to 150 ms. Every second it reports underruns ({a: stats}: frames of silence, gaps,
  // frames dropped, queue low/high in frames) - globalThis.__rxcAudio, read by tools/mc2bench.py.
  const WORKLET = `class RexcompOut extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.off = 0; this.queued = 0; this.play = false; this.began = false; this.gain = 1; this.l = 0; this.r = 0; this.k = 0;
      this.target = sampleRate * 0.08;
      this.st = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 };
      this.port.onmessage = e => { if (e.data && e.data.reset) { this.q = []; this.off = this.queued = 0; this.play = this.began = false; this.target = sampleRate * 0.08; this.gain = 0; this.l = this.r = 0; return; }
        this.q.push(e.data); this.queued += e.data.length / 2;
        if (this.queued > sampleRate * 0.35) { while (this.q.length > 1) { const f = this.q[0].length / 2 - this.off; if (this.queued - f < Math.max(sampleRate * 0.15, this.target)) break; this.q.shift(); this.queued -= f; this.st.drop += f; this.off = 0; } this.gain = 0; } }; }
    process(inputs, outputs) { const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length; let i = 0;
      if (!this.play && this.queued >= this.target) { this.play = true; this.began = true; this.gain = 0; }
      if (this.play) {
        while (i < n && this.q.length) { const b = this.q[0], frames = b.length / 2, take = Math.min(n - i, frames - this.off);
          for (let k = 0; k < take; k++) { const g = this.gain; L[i + k] = b[(this.off + k) * 2] * g; R[i + k] = b[(this.off + k) * 2 + 1] * g; if (g < 1) this.gain = Math.min(1, g + 1 / 128); }
          i += take; this.off += take; this.queued -= take; if (this.off >= frames) { this.q.shift(); this.off = 0; } }
        if (i) { this.l = L[i - 1]; this.r = R[i - 1]; }
        if (i < n) { this.play = false; this.target = Math.min(sampleRate * 0.24, this.target + sampleRate * 0.04); this.st.gaps++; }
      }
      if (i < n && this.began) this.st.starve += n - i;
      for (; i < n; i++) { this.l *= 0.9; this.r *= 0.9; L[i] = this.l; R[i] = this.r; }
      if (this.queued < this.st.qmin) this.st.qmin = this.queued; if (this.queued > this.st.qmax) this.st.qmax = this.queued;
      if (++this.k % 375 === 0) { this.st.targetMs = this.target * 1000 / sampleRate; this.port.postMessage({ a: this.st }); this.st = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 }; }
      return true; } }
  registerProcessor('rexcomp-out', RexcompOut);`;
  // AudioWorklet needs a secure context (https or localhost): over plain http (a Chromebook opening http://<pc>:8120) the same
  // processor runs on the page thread behind a ScriptProcessorNode. 4096-frame callbacks (85 ms) ride out long game frames, at
  // the cost of some latency. The node gets an AudioWorkletNode-shaped .port (library.js posts the PCM there). ?audio=script forces it.
  function scriptOut(ctx) {
    let Proc = null;
    new Function('AudioWorkletProcessor', 'registerProcessor', 'sampleRate', WORKLET)(class { constructor() { this.port = {}; } }, (n, c) => { Proc = c; }, ctx.sampleRate);
    const p = new Proc(), sp = ctx.createScriptProcessor(4096, 0, 2), port = { onmessage: null, postMessage: d => p.port.onmessage({ data: d }) };
    p.port.postMessage = m => { if (port.onmessage) port.onmessage({ data: m }); };
    sp.onaudioprocess = e => { const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < L.length; i += 128) p.process([], [[L.subarray(i, i + 128), R.subarray(i, i + 128)]]); };
    sp.port = port; console.log('[audio] no AudioWorklet (not a secure context): ScriptProcessor output');
    return sp;
  }
  async function startAudio(M) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      M.audioContext = ctx; M.soundOn = true;
      const soundLabel = () => { $('bsound').textContent = !M.soundOn ? 'Sound: off' : ctx.state === 'running' ? 'Sound: on' : 'Sound: click to enable'; };
      ctx.onstatechange = soundLabel; soundLabel();
      ctx.resume().catch(() => soundLabel());
      const ensureAudio = () => { if (M.soundOn && ctx.state !== 'running') ctx.resume().catch(soundLabel); };
      document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureAudio(); });
      addEventListener('focus', ensureAudio);
      addEventListener('pointerdown', ensureAudio, true);
      addEventListener('keydown', ensureAudio, true);
      let node;
      if (ctx.audioWorklet && q.get('audio') !== 'script') {
        await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
        node = new AudioWorkletNode(ctx, 'rexcomp-out', { numberOfInputs: 0, outputChannelCount: [2] });
      } else node = scriptOut(ctx);
      node.connect(ctx.destination); M.audioNode = node;
      const an = ctx.createAnalyser(); an.fftSize = 2048; node.connect(an);
      window.rxcAudioLevel = async ms => {
        const buf = new Float32Array(an.fftSize), end = performance.now() + (ms || 3000); let n = 0, sum = 0, peak = 0, loud = 0, polls = 0;
        while (performance.now() < end) { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) { s += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); } sum += s; n += buf.length; polls++; if (Math.sqrt(s / buf.length) > 0.001) loud++; await new Promise(r => setTimeout(r, 40)); }
        return { state: ctx.state, rms: Math.sqrt(sum / Math.max(1, n)), peak, audibleFraction: loud / Math.max(1, polls), destinationChannels: ctx.destination.channelCount };
      };
      // underrun totals since the last read (tools/mc2bench.py reads and resets them)
      node.port.onmessage = e => { const a = e.data.a, t = globalThis.__rxcAudio || (globalThis.__rxcAudio = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 });
        t.starve += a.starve; t.gaps += a.gaps; t.drop += a.drop; t.qmin = Math.min(t.qmin, a.qmin); t.qmax = Math.max(t.qmax, a.qmax); t.targetMs = a.targetMs; };
      $('bsound').onclick = () => { M.soundOn = !M.soundOn || ctx.state !== 'running'; (M.soundOn ? ctx.resume() : ctx.suspend()).catch(() => {}).finally(soundLabel); soundLabel(); };
    } catch (e) { console.warn('[audio] unavailable:', e); $('bsound').textContent = 'Sound: n/a'; }
  }

  // ---- debug: window.rxcDump(glTexture, w, h, isFloat, name) reads a render target back from the graphics worker and POSTs it
  // as a PNG to the dev server (tools/serve_web.py -> build/<name>/shots/<name>.png). Texture ids come from the pass log
  // (window.rexcomp.gfxWorker.postMessage({passlog: 1}), lines "-> rt texN").
  // window.rxcProfile(ms, name, focus): samples the engine thread for ms and POSTs <name>.json: self and inclusive shares,
  // the 4 callers under each sampled leaf ("callers"), and what each function named in focus (default: the compute and
  // upload entry points) spends its time in ("kids": focus -> callee)
  window.rxcProfile = async (ms, name, focus) => {
    const P = new Profiler({ sampleInterval: 1, maxBufferSize: 200000 });
    await new Promise(r => setTimeout(r, ms || 5000));
    const t = await P.stop(), self = new Map(), incl = new Map(), calls = new Map(), kids = new Map(), fname = i => { const f = t.frames[i]; return f ? (f.name || '?') + (f.resourceId !== undefined && !f.name ? '@' + f.line : '') : '?'; };
    const fo = new Set(focus || ['compute_dispatch', 'gfx_update_subresource', 'cs_run_range', 'gpu_pass', 'upload', 'rt_ic_lookup', 'get_module_handle']);
    const up = st => st.parentId !== undefined ? t.stacks[st.parentId] : null, add = (m, k) => m.set(k, (m.get(k) || 0) + 1);
    let n = 0;
    for (const s of t.samples) {
      if (s.stackId === undefined) continue; n++;
      let st = t.stacks[s.stackId]; const top = fname(st.frameId); add(self, top);
      const chain = []; for (let q = up(st); q && chain.length < 4; q = up(q)) chain.push(fname(q.frameId));
      add(calls, [top, ...chain].join(' <- '));
      const seen = new Set(); let callee = null;
      while (st) { const nm = fname(st.frameId); if (!seen.has(nm)) { seen.add(nm); add(incl, nm); if (fo.has(nm)) add(kids, nm + ' -> ' + (callee || '(self)')); } callee = nm; st = up(st); }
    }
    const top = (m, k) => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, k).map(([f, c]) => `${(100 * c / n).toFixed(1)}% ${f}`);
    const out = { samples: n, ms, self: top(self, 80), inclusive: top(incl, 150), callers: top(calls, 120), kids: top(kids, 80) };
    await fetch('/upload/' + (name || 'profile') + '.json', { method: 'POST', body: JSON.stringify(out, null, 1) });
    return n;
  };
  window.rxcDump = (tex, w, h, fl, name) => window.rexcomp.gfxWorker.postMessage({ readtex: [tex, w, h, fl ? 1 : 0, name || ('tex' + tex)] });
  function rxcImage(im) {
    const c = new OffscreenCanvas(im.w, im.h); c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(im.data.buffer), im.w, im.h), 0, 0);
    c.convertToBlob({ type: 'image/png' }).then(b => fetch('/upload/' + im.name + '.png', { method: 'POST', body: b })).then(() => console.log('[dump] uploaded ' + im.name));
  }

  const PROG_KEY = 'rxcPrograms';
  const loadLearned = () => { try { const a = JSON.parse(localStorage.getItem(PROG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const saveLearned = () => {
    const cur = globalThis.__rxcPrograms; if (!cur || !cur.length) return;
    try { const all = new Set(loadLearned()); for (const k of cur) all.add(k); localStorage.setItem(PROG_KEY, JSON.stringify([...all].slice(-8000))); } catch (e) {}
  };

  // ---- start
  const bar = $('bar').firstElementChild;
  let gameDataComplete = false;
  $('play').onclick = async () => {
    if (started) return; started = true;
    startupLogStart = performance.now(); startupLogActive = true; startupLog.textContent = '[0.0s] Starting…\n';
    $('play').disabled = true; status('Loading engine…'); bar.parentElement.classList.add('indeterminate');
    const t0 = performance.now();
    M = {
      onExit: code => { try { window.__rxcRelayClose && window.__rxcRelayClose('guest exit ' + code); } catch (e) {} },
      canvas, arguments: [launchArgs()], yieldMode: PACE[pace][1], fpsCap: PACE[pace][2] || FPS, fileCacheMB: LOW_MEM ? 256 : 0,
      // ?mt=N: N guest threads get a host thread of their own (0 = the threaded module, still cooperative)
      gameBase: q.get('base') || GAME_BASE,
      // the project (and Saved dir) is Chameleon, not the exe's PenguinHotel. AuthenticationGraph=Anonymous: device-id
      // sign-in, answered by the EOS fake; without it sign-in fails ("invalid auth token") and Create Server stops.
      iniSeed: [{ file: 'C:\\Users\\Player\\AppData\\Local\\Chameleon\\Saved\\Config\\Windows\\Engine.ini', section: 'SystemSettings', values: { 'r.ScreenPercentage': effectiveScale(), ...WEB_CVARS } },
        { file: 'C:\\Users\\Player\\AppData\\Local\\Chameleon\\Saved\\Config\\Windows\\Engine.ini', section: 'EpicOnlineServices', values: { AuthenticationGraph: 'Anonymous' } },
        ...qualitySeed(),
        // audio: with -nothreading UE mixes on the game thread, once a frame, so its output queue has to outlast a slow
        // frame - 6 x 1024 frames = 128 ms (the Windows default, 1 buffer -> 2 slots, is 43 ms). ?abuf=frames ?anbuf=buffers
        { file: 'C:\\Users\\Player\\AppData\\Local\\Chameleon\\Saved\\Config\\Windows\\Engine.ini', section: '/Script/WindowsTargetPlatform.WindowsTargetSettings',
          values: { AudioCallbackBufferFrameSize: q.get('abuf') || '1024', AudioNumBuffersToEnqueue: q.get('anbuf') || '6' } },
        { file: 'C:\\Users\\Player\\AppData\\Local\\Chameleon\\Saved\\Config\\Windows\\Engine.ini', section: 'Audio', values: { UnfocusedVolumeMultiplier: q.get('ufvol') || '1.0' } },
        // UE's frame-rate smoothing (on in this game) holds every frame to the running average of the game thread's work
        // (UEngine::UpdateTimeAndHandleMaxTickRate; 17.6 ms in the mansion), so faster frames wait: 55.6 instead of 56.7
        // fps there. The page paces frames itself (the 60 fps cap / vsync buttons). ?smooth=1 turns it on, ?smooth=game
        // leaves the game's own setting
        ...(q.get('smooth') === 'game' ? [] : [{ file: 'C:\\Users\\Player\\AppData\\Local\\Chameleon\\Saved\\Config\\Windows\\Engine.ini', section: '/Script/Engine.Engine', values: { bSmoothFrameRate: q.get('smooth') === '1' ? 'True' : 'False' } }])],
      preRun: [m => { m.ENV.REXCOMP_MT = q.get('mt') || '0'; m.ENV.REXCOMP_SCREEN = res.join('x'); Object.assign(m.ENV, PORT_ENV, LOW_END ? LOW_END_ENV : {}); for (const [k, v] of q) if (k.startsWith('REXCOMP_')) m.ENV[k] = v; m.ENV.REXCOMP_RELAY = PROD_RELAY; }],   // debug switches, e.g. ?REXCOMP_INPUT=...; the relay is the build's, whatever the address says
      print: s => { console.log(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      printErr: s => { console.error(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      onDownloadProgress: (loaded, total) => {
        gameDataComplete = loaded === total;
        bar.parentElement.classList.remove('indeterminate');
        bar.style.width = (100 * loaded / total).toFixed(1) + '%';
        status(`Executable image ${Math.floor(100 * loaded / total)}% (${(loaded / 1048576).toFixed(0)} / ${(total / 1048576).toFixed(0)} MB)`);
      },
      onStatus: s => {
        if (gameDataComplete && /^starting/i.test(s)) { status('Executable image 100% downloaded · Starting game…'); return; }
        if (!gameDataComplete) bar.parentElement.classList.add('indeterminate');
        status(s);
      },
      onFirstFrame: () => { markQualityApplied(); flushStartupLog(); startupLogActive = false; bar.parentElement.classList.remove('indeterminate'); bar.style.width = '100%'; $('overlay').classList.add('hidden'); $('hint').classList.add('show'); setTimeout(() => $('hint').classList.remove('show'), 5000); canvas.focus(); syncLock(); },
    };
    const useWorker = q.get('gfxworker') !== '0' && !!canvas.transferControlToOffscreen;
    window.rexcomp = M;
    // graphics on a worker thread: the canvas is handed to rt/gfxworker (OffscreenCanvas) and the engine thread only
    // records commands (rt/web/gfx_remote.c). ?gfxworker=0 keeps WebGL on the engine thread.
    if (useWorker) {
      try {
        // (worker defaults, ?REXCOMP_...= overrides them) UE's HZB build and the other shared-memory compute passes are
        // small here: replaying them unsliced is what the game had before the 16-row batches (each batch a fence + a
        // worker task: ~45 ms of waiting a frame at 960x540, 54 -> 17 fps)
        // A classic worker script cannot be cross-origin, and the canvas must only be handed over once the worker
        // exists: transferring it first would leave a canvas nobody draws to if the worker could not be created, which
        // is exactly what a page whose assets come from a CDN would hit (WebGL then stays on the engine thread).
        // gfx-boot.js builds the worker: the plain file when it is same-origin, and a blob: URL rebuilt from it when
        // the page is served from a CDN. The canvas is transferred only once the worker exists, so a failure here
        // leaves the engine-thread path a canvas it can actually draw to.
        const w = await rxcMakeGfxWorker(), off = canvas.transferControlToOffscreen(), env = { REXCOMP_CS_BATCH_ROWS: '65536' };
        for (const [k, v] of q) if (k.startsWith('REXCOMP_') && !['REXCOMP_INPUT', 'REXCOMP_EXIT_AT', 'REXCOMP_SHOT'].includes(k)) env[k] = v;
        M.__gfxEarly = [];
        w.onmessage = e => {
          if (e.data.img) return rxcImage(e.data.img);
          if (e.data.lost) return showFatal('The graphics device was reset', GPU_LOST);
          if (e.data.fatal) return showFatal('The graphics worker stopped', 'The graphics worker crashed: ' + e.data.fatal + '\n\nReload the page to continue.');
          M.__gfxmsg ? M.__gfxmsg(e.data) : M.__gfxEarly.push(e.data);
        };
        w.onerror = e => { console.error('[gfx worker] ' + (e.message || e)); showFatal('The graphics worker stopped', 'The graphics worker failed: ' + fatalText(e) + '\n\nReload the page to continue.'); };
        const noprelink = M.prelinkShaders === false || q.has('noprelink');
        w.postMessage({ init: true, canvas: off, env, noprelink, learned: noprelink ? [] : loadLearned() }, [off]);
        setInterval(saveLearned, 15000); addEventListener('pagehide', saveLearned);
        M.gfxWorker = w;
      } catch (e) { console.warn('[web] graphics worker unavailable, WebGL stays on the engine thread:', e); }
    }
    // the engine loads levels synchronously (no frames for many seconds): show a spinner whenever frames stop for 1.5 s
    setInterval(() => { const t = M.__lastPresent; $('busy').classList.toggle('show', !!t && performance.now() - t > 1500); }, 250);
    if (q.has('logsink')) {
      globalThis.__rxcSink = [];
      fetch('/log?start=1', { method: 'POST', body: '' });
      setInterval(() => { const b = globalThis.__rxcSink; if (!b.length) return; globalThis.__rxcSink = []; fetch('/log', { method: 'POST', body: b.join('\n') + '\n' }); }, 1000);
      let dumped = 0;
      setInterval(() => { const t = M.__lastPresent; if (t && performance.now() - t > 12000 && performance.now() - dumped > 60000 && M._rxc_dbg_thrdump) { dumped = performance.now(); M._rxc_dbg_thrdump(); } }, 2000);
    }
    await startAudio(M);                   // inside the click: user activation lets the AudioContext start
    Rexcomp(M).catch(e => {
      status('Failed to start: ' + e);
      if (outOfMemory(e)) showFatal('Not enough memory', 'The browser could not give the game the memory it needs: about 1.9 GB for the game itself, plus the game files it has read (capped at 256 MB on a 4 GB device).\n\nClose other tabs and apps, then reload. If this device has 4 GB, also try 540p with a 50% 3D resolution and the 30 fps cap.');
      else showFatal('The game stopped', 'It failed while starting: ' + fatalText(e) + '\n\nReload the page to continue. The Log button (F9) keeps the engine log.');
      console.error(e); if (globalThis.__rxcSink) globalThis.__rxcSink.push('[web] main thread crashed: ' + (e && e.stack ? e.stack : e));
    });
    // the page stays interactive while main() runs on its own JSPI stack; clicking the canvas captures the mouse
    canvas.focus(); syncLock();
  };
  // the game starts with the page: no landing screen, one click to play is gone. A browser without WebAssembly JSPI
  // leaves the (hidden, disabled) Play button alone and the status line says what to use. Sound still needs a gesture:
  // the AudioContext starts suspended and startAudio's pointerdown / keydown / focus handlers resume it on the first one.
  if (!$('play').disabled) $('play').onclick();
})();
</script>
<script src="install.js?v=5" defer></script>
</body></html>
